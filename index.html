</style></head><body><canvas id="game"></canvas><div id="hud"><div class="chip">🐻 <span id="level">1/3</span><br><small id="world">NEON HARBOR</small></div><div class="chip">♫ <span id="notes">0/0</span></div><div class="chip">♥ <span id="lives">3</span></div><button id="pause" aria-label="Pause">Ⅱ</button></div><div id="message"></div><div id="hint">◀ ▶ Bewegen · ▲ Nach vorne · JUMP Springen</div><div id="control"><div class="group"><button class="key" id="left" aria-label="Links">◀</button><button class="key" id="forward" aria-label="Vorwärts">▲</button><button class="key" id="right" aria-label="Rechts">▶</button></div><button class="key" id="jump">JUMP</button></div><div id="overlay"><div class="panel"><div style="font-size:53px">🐻✨</div><h1 id="title">PS BÄR 3D</h1><p id="description">SKYBOUND ADVENTURE<br>3 echte räumliche Spielwelten, 3D-Bär, Sprünge, schwebende Musiknoten und ein Zielportal.<br><br>Auf dem Handy mit den Tasten spielen. Am PC: WASD / Pfeile + Leertaste.</p><button id="start">SPIELEN ▶</button></div></div><script>

const ui={level:document.querySelector('#level'),world:document.querySelector('#world'),notes:document.querySelector('#notes'),lives:document.querySelector('#lives'),overlay:document.querySelector('#overlay'),title:document.querySelector('#title'),description:document.querySelector('#description'),start:document.querySelector('#start'),msg:document.querySelector('#message')};const keys={left:false,right:false,forward:false,back:false,jump:false};let active=false,paused=false,worldIndex=0,score=0,lives=3,cam={x:0,y:6,z:-10},elapsed=0,msgTimer=0,invincible=0,particles=[];
const themes=[{name:'NEON HARBOR',sky:['#101536','#344b94','#e978be'],ground:'#293d76',side:'#122046',edge:'#5bf5fb',rail:'#ff79de',fog:'#a88aca',hill:'#273375',start:0},{name:'CANDY SKY',sky:['#588cd4','#bcb1f5','#fbcbbd'],ground:'#aa81e1',side:'#7052ae',edge:'#fff1ad',rail:'#ff5da8',fog:'#ffdaec',hill:'#8f90d1',start:1},{name:'EMERALD MOON',sky:['#061d30','#126166','#64b39d'],ground:'#247d76',side:'#0d3b4e',edge:'#9dfdc3',rail:'#42ffc8',fog:'#82baa0',hill:'#14616c',start:2}];
const designs=[[[0,0,7,9],[0,10,7,6],[2,17,7,6],[-1,24,7,7],[0,33,7,7],[0,42,7,9]],[[0,0,7,8],[2,9,7,6],[-1,17,7,7],[1,25,7,8],[-2,34,7,7],[0,43,7,9]],[[0,0,7,8],[-2,9,7,7],[1,18,7,6],[0,26,7,7],[2,35,7,7],[0,44,7,9]]];let platforms=[],notes=[],enemies=[],goal={},player={x:0,y:1.15,z:1.2,vx:0,vy:0,vz:0,onGround:true,face:0,walk:0,land:0};
function loadLevel(n){worldIndex=n;let d=designs[n];platforms=d.map(([x,z,w,len],i)=>({x,z,w,len,top:i===0?0:(i===d.length-1?.1:(i%3===1?.45:i%3===2?.8:0)),id:i}));notes=[];enemies=[];for(let i=0;i<platforms.length;i++){let p=platforms[i];for(let j=0;j<3;j++)notes.push({x:p.x+Math.sin((j+1)*2.2+i)*p.w*.28,y:p.top+1.5+(j%2)*.5,z:p.z+2+(j/3)*(p.len-3),got:false,rot:j});if(i>0&&i%2===1)enemies.push({x:p.x,y:p.top+.6,z:p.z+p.len*.6,t:i,live:true})}let end=platforms.at(-1);goal={x:end.x,z:end.z+end.len-1.6,y:end.top+1.6};player={x:0,y:1.1,z:1.4,vx:0,vy:0,vz:0,onGround:true,face:0,walk:0,land:0};cam={x:0,y:5.7,z:-9.5};invincible=1.8;ui.level.textContent=`${n+1}/3`;ui.world.textContent=themes[n].name;updateHud();announce(n===0?'LEVEL 1 · NEON HARBOR':n===1?'LEVEL 2 · CANDY SKY':'LEVEL 3 · EMERALD MOON')}
function updateHud(){ui.notes.textContent=`${score}/${54}`;ui.lives.textContent=lives}function announce(s){ui.msg.textContent=s;ui.msg.classList.add('show');msgTimer=2.2}function gameOver(win){active=false;ui.overlay.classList.remove('hidden');ui.title.textContent=win?'GESCHAFFT! 🏆':'GAME OVER';ui.description.innerHTML=win?'Du hast alle drei 3D-Welten gemeistert! 🐻🎶<br>Bereit für die nächste Runde?':'Der Bär braucht eine Pause. Versuche es nochmal! ❤️';ui.start.textContent='NOCHMAL SPIELEN ▶'}function hurt(){if(invincible>0)return;lives--;updateHud();invincible=1.7;if(lives<=0){gameOver(false);return}player.x=platforms[0].x;player.z=1.4;player.y=1.2;player.vx=player.vz=player.vy=0;announce('AUA! ♥ −1')}
function showStart(){ui.overlay.classList.add('hidden');lives=3;score=0;loadLevel(0);paused=false;active=true;document.querySelector('#pause').textContent='Ⅱ'}ui.start.addEventListener('click',showStart);document.querySelector('#pause').addEventListener('click',()=>{if(!active)return;paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ';announce(paused?'PAUSE':'WEITER!')});
for(const name of ['left','right','forward','jump']){const el=document.querySelector('#'+name);let k=name;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);keys[k]=true;el.classList.add('down')});for(let evt of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(evt,()=>{keys[k]=false;el.classList.remove('down')})}const km={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'forward',KeyW:'forward',ArrowDown:'back',KeyS:'back',Space:'jump'};addEventListener('keydown',e=>{if(km[e.code]){e.preventDefault();keys[km[e.code]]=true}});addEventListener('keyup',e=>{if(km[e.code])keys[km[e.code]]=false});addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
// Fixed chase camera. All objects are positioned in 3D world-space, projected with perspective.
function project(x,y,z){let dx=x-cam.x,dy=y-cam.y,dz=z-cam.z;let depth=dz*.94+dy*.342;let vertical=dy*.94-dz*.342;let scale=Math.min(W,H)*.96/(depth+9);if(depth<-.3)return null;return {x:W*.5+dx*scale,y:H*.55-vertical*scale,s:scale,depth}}let drawQueue=[];function polygon(points,fill,stroke,width=1){const v=points.map(p=>project(...p));if(v.some(p=>!p))return;drawQueue.push({depth:v.reduce((s,p)=>s+p.depth,0)/v.length,draw(){ctx.beginPath();ctx.moveTo(v[0].x,v[0].y);for(let i=1;i<v.length;i++)ctx.lineTo(v[i].x,v[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke()}}})}
function cube(x,y,z,w,h,d,top,front,side,edge){let x0=x-w/2,x1=x+w/2,z0=z,z1=z+d,y0=y,y1=y+h;polygon([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],top,edge,1.5);polygon([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],front);polygon([[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],side);polygon([[x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1]],side)}
function ball(x,y,z,r,color,opt={}){let p=project(x,y,z);if(!p)return;drawQueue.push({depth:p.depth,draw(){let R=Math.max(1,r*p.s);let grad=ctx.createRadialGradient(p.x-R*.3,p.y-R*.4,R*.04,p.x,p.y,R);grad.addColorStop(0,opt.light||'#ffffff');grad.addColorStop(.32,color);grad.addColorStop(1,opt.dark||'#16112c');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(p.x,p.y,R*(opt.wx||1),R*(opt.wy||1),opt.angle||0,0,Math.PI*2);ctx.fill();if(opt.outline){ctx.lineWidth=Math.max(1,p.s*.028);ctx.strokeStyle=opt.outline;ctx.stroke()}}})}
function ring(x,y,z,r,color,phase=0){let p=project(x,y,z);if(!p)return;drawQueue.push({depth:p.depth,draw(){ctx.save();ctx.translate(p.x,p.y);ctx.scale(.68+Math.abs(Math.sin(phase))*.32,1);ctx.strokeStyle=color;ctx.shadowColor=color;ctx.shadowBlur=16;ctx.lineWidth=Math.max(3,p.s*.085);ctx.beginPath();ctx.ellipse(0,0,p.s*r,p.s*r*.82,0,0,Math.PI*2);ctx.stroke();ctx.restore()}})}
function bear(){const p=player;let running=Math.min(1,Math.hypot(p.vx,p.vz)/6);let gait=Math.sin(p.walk*12)*running;let jump=!p.onGround;let bounce=p.onGround?Math.abs(Math.sin(p.walk*12))*.055*running:0;let rot=p.face;let dir=Math.sin(rot);let z=p.z;let x=p.x;let y=p.y+bounce;let legSpread=gait*.2;const dark='#11131e',fur='#cc7537',cream='#f8d5a0';ball(x-.27,y-.87,z-.08+legSpread,.26,dark,{wx:.9,wy:.72,light:'#373744'});ball(x+.27,y-.87,z-.08-legSpread,.26,dark,{wx:.9,wy:.72,light:'#373744'});ball(x-.27,y-.47,z+.03+legSpread*.7,.24,'#222431',{wy:1.35});ball(x+.27,y-.47,z+.03-legSpread*.7,.24,'#222431',{wy:1.35});ball(x,y+.04,z,.69,'#151725',{wy:.95,light:'#38394b'});ball(x-.73,y+.1+gait*.15,z,.22,fur,{wy:1.3});ball(x+.73,y+.1-gait*.15,z,.22,fur,{wy:1.3});ball(x,y+.97,z,.66,fur,{light:'#f6b56e',dark:'#7a3b24'});ball(x-.53,y+1.47,z+.01,.235,fur,{light:'#f0b06b'});ball(x+.53,y+1.47,z+.01,.235,fur,{light:'#f0b06b'});ball(x,y+.67,z-.44,.32,cream,{wx:1.24,wy:.9});ball(x,y+.84,z-.69,.13,'#292029',{wy:.8});ball(x-.245,y+1.04,z-.54,.15,dark,{wx:1.25});ball(x+.245,y+1.04,z-.54,.15,dark,{wx:1.25});ball(x-.245,y+1.04,z-.57,.09,'#d49f60');ball(x+.245,y+1.04,z-.57,.09,'#d49f60');ball(x,y+1.5,z,.72,dark,{wy:.21,light:'#373949'});ball(x,y+1.78,z-.11,.53,dark,{wy:.31,light:'#3d4050'});ball(x,y+.18,z-.65,.16,'#ff40ae',{light:'#ffd2ef'});ring(x,y+.18,z-.68,.29,'#4aeeff',elapsed*2);if(jump)ring(x,y-.97,z,.36,'#fff4be',elapsed*5)}
function update(dt){elapsed+=dt;if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)ui.msg.classList.remove('show')}if(!active||paused)return;invincible=Math.max(0,invincible-dt);let p=player;let tx=(+keys.right)-(+keys.left),tz=(+keys.forward)-(+keys.back);if(tx&&tz){tx*=.707;tz*=.707}let acceleration=p.onGround?25:12;p.vx+=(tx*6-p.vx)*Math.min(1,acceleration*dt/6);p.vz+=(tz*8.2-p.vz)*Math.min(1,acceleration*dt/8);if(Math.abs(tx)+Math.abs(tz)>0)p.walk+=dt*Math.min(1.6,Math.hypot(p.vx,p.vz)/5);if(keys.jump&&p.onGround){p.vy=10.8;p.onGround=false;p.y+=.03;keys.jump=false;document.querySelector('#jump').classList.remove('down')}let oldBottom=p.y-.99;p.vy-=25*dt;p.y+=p.vy*dt;p.x+=p.vx*dt;p.z+=p.vz*dt;p.onGround=false;for(const a of platforms){if(p.x>a.x-a.w/2+.25&&p.x<a.x+a.w/2-.25&&p.z>a.z-.1&&p.z<a.z+a.len+.1&&p.vy<=0&&oldBottom>=a.top-.14&&p.y-.99<=a.top){p.y=a.top+.99;p.vy=0;p.onGround=true;break}}if(p.y< -8){hurt();return}p.x=Math.max(-8,Math.min(8,p.x));for(const a of notes){if(!a.got&&Math.hypot(p.x-a.x,p.y-a.y,p.z-a.z)<1.15){a.got=true;score++;updateHud();for(let j=0;j<7;j++)particles.push({x:a.x,y:a.y,z:a.z,vx:(Math.random()-.5)*3,vy:Math.random()*3,vz:(Math.random()-.5)*3,life:.8})}}for(const e of enemies){if(!e.live)continue;let ex=e.x+Math.sin(elapsed*1.2+e.t)*1.2;if(Math.hypot(p.x-ex,p.z-e.z)<.68&&Math.abs(p.y-e.y)<1.2){if(p.vy< -1&&p.y>e.y+.4){e.live=false;p.vy=8;score+=2;announce('+2 ♫ GEGNER BESIEGT!');updateHud()}else hurt()}}if(Math.hypot(p.x-goal.x,p.z-goal.z)<1.65&&p.y>goal.y-2){if(worldIndex===2){gameOver(true);return}loadLevel(worldIndex+1)}for(const a of particles){a.x+=a.vx*dt;a.y+=a.vy*dt;a.z+=a.vz*dt;a.vy-=5*dt;a.life-=dt}particles=particles.filter(a=>a.life>0);cam.x+=(p.x-cam.x)*Math.min(1,dt*3);cam.y+=(p.y+5.4-cam.y)*Math.min(1,dt*2.4);cam.z+=(p.z-11-cam.z)*Math.min(1,dt*2.8)}
function background(){let th=themes[worldIndex],g=ctx.createLinearGradient(0,0,0,H);th.sky.forEach((c,i)=>g.addColorStop(i/2,c));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<26;i++){let x=((i*133.13+23)%W),y=((i*49.7+17)%(H*.55));ctx.globalAlpha=.2+.22*Math.sin(elapsed*.6+i)**2;ctx.beginPath();ctx.arc(x,y,(i%3===0?2:1),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;let sunX=W*.76,sunY=H*.28;let glow=ctx.createRadialGradient(sunX,sunY,4,sunX,sunY,130);glow.addColorStop(0,'#fff9c0');glow.addColorStop(.2,th.rail);glow.addColorStop(1,'#ffffff00');ctx.fillStyle=glow;ctx.fillRect(sunX-130,sunY-130,260,260);ctx.fillStyle=th.hill;ctx.beginPath();ctx.moveTo(0,H*.78);for(let x=0;x<=W+30;x+=20){let h=Math.sin((x+cam.x*11)*.012)*33+Math.sin((x-cam.z*3)*.029)*20;ctx.lineTo(x,H*.7-h)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle=th.fog;ctx.globalAlpha=.16;ctx.fillRect(0,H*.75,W,H*.25);ctx.globalAlpha=1}
function draw(){background();drawQueue=[];let t=themes[worldIndex];for(const a of platforms){cube(a.x,a.top-.7,a.z,a.w,.7,a.len,t.ground,t.side,'#111b3d',t.edge);for(let i=0;i<Math.ceil(a.len/2);i++){let zz=a.z+.7+i*2;cube(a.x-a.w/2+.25,a.top+.05,zz,.18,.10,.75,t.rail,t.rail,t.side);cube(a.x+a.w/2-.25,a.top+.05,zz,.18,.10,.75,t.rail,t.rail,t.side)}}for(const n of notes)if(!n.got)ring(n.x,n.y+Math.sin(elapsed*3+n.rot)*.17,n.z,.29,'#ffe879',elapsed*2+n.rot);for(const e of enemies)if(e.live){let x=e.x+Math.sin(elapsed*1.2+e.t)*1.2;ball(x,e.y,e.z,.52,'#a247bd',{light:'#f39dff'});ball(x-.17,e.y+.14,e.z-.43,.09,'#ffffff');ball(x+.17,e.y+.14,e.z-.43,.09,'#ffffff')}ring(goal.x,goal.y+1,goal.z,1.0,'#62fff5',elapsed*2);ring(goal.x,goal.y+1,goal.z,1.28,'#fc88ed',elapsed*3);for(const a of particles)ball(a.x,a.y,a.z,.08,'#fff0a1');if(invincible<=0||Math.floor(elapsed*12)%2===0)bear();drawQueue.sort((a,b)=>b.depth-a.depth);for(const x of drawQueue)x.draw();const v=project(player.x,player.y+2.3,player.z);if(v&&active){ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=8;ctx.fillText('PS BÄR',v.x,v.y-10);ctx.shadowBlur=0}}
let last=0;function loop(ts){let dt=Math.min(.033,(ts-last)/1000||.016);last=ts;update(dt);draw();requestAnimationFrame(loop)}loadLevel(0);requestAnimationFrame(loop);
